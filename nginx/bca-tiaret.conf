# ==============================================================================
# CONFIGURATION NGINX DE PRODUCTION - B.C.A. TIARET
# ==============================================================================

# 1. Redirection automatique HTTP vers HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name bca-tiaret.dz www.bca-tiaret.dz;

    # Défi ACME pour le renouvellement automatique Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Serveur HTTPS Principal
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bca-tiaret.dz www.bca-tiaret.dz;

    # Certificats SSL Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/bca-tiaret.dz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bca-tiaret.dz/privkey.pem;

    # Paramètres de sécurité SSL durcis (Mozilla Modern Configuration)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Headers de sécurité HTTP
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Compression Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Taille maximale des uploads (doit correspondre à Multer)
    client_max_body_size 15M;

    # Racine des fichiers statiques compilés du frontend React (Vite)
    root /var/www/bca/client/dist;
    index index.html;

    # --------------------------------------------------------------------------
    # Fichiers médias uploadés (Stockage local /uploads)
    # --------------------------------------------------------------------------
    location /uploads/ {
        alias /var/www/bca/server/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # Assets statiques compilés (JS, CSS, Polices, Images) avec cache fort
    # --------------------------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # API REST Express (Reverse Proxy vers Node.js / PM2)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # Sitemap XML & Robots.txt dynamiques transmis au backend
    # --------------------------------------------------------------------------
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:5000/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:5000/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --------------------------------------------------------------------------
    # Routage SPA React Router (fallback sur index.html pour les URLs profondes)
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Journaux de requêtes et d'erreurs
    access_log /var/log/nginx/bca-access.log;
    error_log /var/log/nginx/bca-error.log warn;
}
